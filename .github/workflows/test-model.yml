name: Test Model

on:
  push:
    paths:
      - 'architecture/**'
      - 'model/**'
      - 'tests/architecture/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
  pull_request:
    paths:
      - 'architecture/**'
      - 'model/**'
      - 'tests/architecture/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run model tests
        run: |
          pytest -q tests/architecture
