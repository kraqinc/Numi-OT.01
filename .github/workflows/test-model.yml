name: Test Model

on:
  push:
    paths:
      - 'architecture/**'
      - 'model/**'
      - 'tests/architecture/**'
      - 'tests/inference/**'
      - 'requirements-ci.txt'
      - 'pyproject.toml'
      - '.github/workflows/test-model.yml'
  pull_request:
    paths:
      - 'architecture/**'
      - 'model/**'
      - 'tests/architecture/**'
      - 'tests/inference/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            pyproject.toml

      - name: Install CPU PyTorch + deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run model tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/architecture tests/inference -q --tb=short
