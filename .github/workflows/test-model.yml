name: Test Model

on:
  push:
    paths:
      - 'architecture/**'
      - 'model/**'
      - 'tests/test_configuration.py'
      - 'tests/test_architecture.py'
  pull_request:
    paths:
      - 'architecture/**'
      - 'model/**'
      - 'tests/test_configuration.py'
      - 'tests/test_architecture.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run model tests
        run: |
          pytest -q tests/test_configuration.py tests/test_architecture.py
