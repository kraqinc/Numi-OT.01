name: Test Tokenizer

on:
  push:
    paths:
      - 'tokenizer/**'
      - 'tests/tokenizer/**'
      - 'requirements-ci.txt'
      - 'pyproject.toml'
      - '.github/workflows/test-tokenizer.yml'
  pull_request:
    paths:
      - 'tokenizer/**'
      - 'tests/tokenizer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-tokenizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokenizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            pyproject.toml

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Tokenizer unit tests do not need torch CUDA; still install CPU torch
          # for any shared imports in the package tree.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run tokenizer tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/tokenizer -q --tb=short
