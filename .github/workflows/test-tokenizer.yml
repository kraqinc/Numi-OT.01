name: Test Tokenizer

on:
  push:
    paths:
      - 'tokenizer/**'
      - 'tests/test_tokenizer.py'
  pull_request:
    paths:
      - 'tokenizer/**'
      - 'tests/test_tokenizer.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tokenizer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tokenizer tests
        run: |
          pytest -q tests/test_tokenizer.py
