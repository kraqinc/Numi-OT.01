name: Validate Numi-OT.01

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            pyproject.toml

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project deps
        run: |
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Check Python syntax
        run: |
          python -m compileall -q architecture model tokenizer training serving evaluation tests

      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.').rglob('*'):
              if path.suffix not in {'.yml', '.yaml'}:
                  continue
              if '.git' in path.parts:
                  continue
              with path.open('r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print(f'OK: {path}')
          PY

      - name: Project structure
        run: |
          for d in architecture model tokenizer training serving evaluation configs tests datasets; do
            test -d "$d" || { echo "::error::Missing $d"; exit 1; }
          done
          echo "Structure OK"

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/architecture tests/tokenizer tests/inference tests/training tests/evaluation tests/serving -q --tb=short
