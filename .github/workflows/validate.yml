name: Validate Numi-OT.01

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q architecture model tokenizer tests configs

      - name: Run Ruff
        run: |
          ruff check architecture model tokenizer tests || true

      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*"):
              if path.suffix not in {".yml", ".yaml"}:
                  continue
              if ".git" in path.parts:
                  continue
              with path.open("r", encoding="utf-8") as file:
                  yaml.safe_load(file)
              print(f"OK: {path}")
          PY

      - name: Run tests
        run: |
          pytest -q tests/architecture tests/tokenizer tests/inference

      - name: Check project structure
        run: |
          required=(
            architecture
            tokenizer
            datasets
            configs
            model
            tests
          )

          for directory in "${required[@]}"; do
            test -d "$directory" || {
              echo "::error::Missing directory: $directory"
              exit 1
            }
          done

          echo "Project structure OK."
