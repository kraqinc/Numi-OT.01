version: "1.0"

name: "Numi Pretraining Corpus"

target_date: "2026-09-18"

output:
  directory: "data/artifacts/corpus"
  compression: "gzip"
  records_per_shard: 100000

processing:
  min_characters: 200
  max_characters: 1000000

  deduplication:
    enabled: true
    algorithm: "sha256"

  pii:
    enabled: true
    action: "reject"

  quality:
    enabled: true

sources:

  - id: "fineweb"
    enabled: true
    type: "huggingface"
    dataset: "HuggingFaceFW/fineweb"
    name: "CC-MAIN-2024-51"
    split: "train"
    text_field: "text"
    weight: 0.45
    mode: "cpt"
    license: "ODC-By-1.0"

  - id: "fineweb_edu"
    enabled: true
    type: "huggingface"
    dataset: "HuggingFaceFW/fineweb-edu"
    name: "sample-10BT"
    split: "train"
    text_field: "text"
    weight: 0.30
    mode: "cpt"
    license: "ODC-By-1.0"

  - id: "starcoder"
    enabled: false
    type: "huggingface"
    dataset: "bigcode/starcoderdata"
    name: "python"
    split: "train"
    text_field: "content"
    weight: 0.15
    mode: "cpt"
    license: "source-dependent"
    requires_access_agreement: true

  - id: "numi_local"
    enabled: true
    type: "jsonl"
    path: "datasets/2026/numi_conversation_seed.jsonl"
    text_field: "messages"
    weight: 0.10
    mode: "sft"
    license: "Numination" 