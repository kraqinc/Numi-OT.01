model:
  name: "Numi-10B"
  version: "0.1.0"
  description: "Original sparse MoE ~10B total params. Built from scratch. No external base weights."

# Target ~10B total (bf16 ≈ 20GB weights only).
# Active params per token much lower (top-2 experts).
# Needs multi-GPU / A100 40GB+ for full SFT — not for free T4.

architecture:
  vocab_size: 32000
  hidden_size: 4096
  intermediate_size: 11008
  moe_intermediate_size: 1408
  num_hidden_layers: 28
  num_attention_heads: 32
  num_key_value_heads: 8
  num_experts: 8
  num_experts_per_tok: 2
  max_position_embeddings: 8192
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

runtime:
  dtype: "bfloat16"
  device: "auto"
