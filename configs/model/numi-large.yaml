model:
  name: "Numi-Large-OT"
  version: "0.1.0"
  description: "Original sparse Mixture-of-Experts language model (~10B total params / ~20GB bf16). Built from scratch. No weights or architecture copied from any existing model."

architecture:
  vocab_size: 128256
  hidden_size: 4096
  intermediate_size: 16384          # dense FFN size (unused when MoE)
  moe_intermediate_size: 2048       # per-expert FFN size
  num_hidden_layers: 32
  num_attention_heads: 32
  num_key_value_heads: 8            # GQA
  num_experts: 16
  num_experts_per_tok: 2
  max_position_embeddings: 16384
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

runtime:
  dtype: "bfloat16"
  device: "auto"
