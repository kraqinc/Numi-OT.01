model:
  name: "Numi-OT.01"
  version: "0.1.0"
  description: "Original sparse Mixture-of-Experts language model"

architecture:
  vocab_size: 128256
  hidden_size: 2048
  intermediate_size: 8192          # dense FFN size (unused when MoE)
  moe_intermediate_size: 1024      # per-expert FFN size
  num_hidden_layers: 24
  num_attention_heads: 16
  num_key_value_heads: 4           # GQA
  num_experts: 8
  num_experts_per_tok: 2
  max_position_embeddings: 8192
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

runtime:
  dtype: "bfloat16"
  device: "auto"
