name: numi-ot-0.1-mid
version: "0.1.1"

model:
  vocab_size: 2048
  hidden_size: 256
  intermediate_size: 512
  moe_intermediate_size: 128
  num_hidden_layers: 6
  num_attention_heads: 8
  num_key_value_heads: 2
  num_experts: 4
