name: numi-dpo
version: "0.1.0"

model:
  vocab_size: 512
  hidden_size: 64
  intermediate_size: 128
  moe_intermediate_size: 32
  num_hidden_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  num_experts: 2
  num_experts_per_tok: 1
  max_position_embeddings: 256
  tie_word_embeddings: true

data:
  path: datasets/2026/numi_preferences_seed.jsonl
  max_seq_length: 128

training:
  output_dir: outputs/dpo
  sft_checkpoint: null
  num_epochs: 2
  learning_rate: 5.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  beta: 0.1
  logging_steps: 1
  seed: 42
  device: auto
