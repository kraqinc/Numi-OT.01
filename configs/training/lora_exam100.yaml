name: numi-lora-exam100
version: "0.6.0"

# Goal: 30/30 on the fixed eval-30 bench (overfit by design).
# Run: python scripts/build_exam_oversample.py
# then: python scripts/training/train_base_lora.py --config configs/training/lora_exam100.yaml

base:
  model_id: "tencent/Hunyuan-7B-Instruct"
  trust_remote_code: true
  torch_dtype: bfloat16
  load_in_4bit: true
  attn_implementation: sdpa

lora:
  r: 64
  alpha: 128
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

data:
  paths:
    - datasets/2026/numi_exam_oversample.jsonl
    - datasets/2026/numi_eval30_sft.jsonl
    - datasets/2026/numi_math_code_extra.jsonl
    - datasets/2026/numi_identity_seed.jsonl
  max_seq_length: 512
  packing: false

training:
  output_dir: outputs/lora_exam100
  num_epochs: 8
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 50
  bf16: true
  gradient_checkpointing: true
  seed: 42

inference:
  max_new_tokens: 32
  temperature: 0.0
  top_p: 1.0
