name: numi-lora-frontier
version: "0.2.2"

# Default = fully public (no gated license wall).
# For stronger bases after accepting licenses on HF:
#   google/gemma-2-9b-it
#   meta-llama/Llama-3.1-8B-Instruct
#   microsoft/Phi-3.5-mini-instruct
# Never Qwen (product rule).

base:
  model_id: "HuggingFaceTB/SmolLM2-1.7B-Instruct"
  trust_remote_code: false
  torch_dtype: bfloat16
  load_in_4bit: true
  attn_implementation: sdpa

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

data:
  paths:
    - datasets/2026/numi_identity_seed.jsonl
    - datasets/2026/numi_conversation_seed.jsonl
    - datasets/2026/numi_code_seed.jsonl
    - datasets/2026/numi_multiturn_seed.jsonl
    - datasets/2026/numi_product_seed.jsonl
  max_seq_length: 1024
  packing: false

training:
  output_dir: outputs/lora_frontier
  num_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 50
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  seed: 42
  report_to: none

inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
