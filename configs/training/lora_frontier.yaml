name: numi-lora-frontier
version: "0.3.0"

# Default larger base for Colab T4/L4 with 4-bit.
# No Qwen. If gated: accept license on HF while logged in.
# Alternative 7B (more VRAM): configs/training/lora_large.yaml

base:
  model_id: "microsoft/Phi-3.5-mini-instruct"
  trust_remote_code: true
  torch_dtype: bfloat16
  load_in_4bit: true
  attn_implementation: sdpa

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - qkv_proj
    - o_proj
    - gate_up_proj
    - down_proj
    - q_proj
    - k_proj
    - v_proj
    - gate_proj
    - up_proj
  bias: none
  task_type: CAUSAL_LM

data:
  paths:
    - datasets/2026/numi_identity_seed.jsonl
    - datasets/2026/numi_conversation_seed.jsonl
    - datasets/2026/numi_code_seed.jsonl
    - datasets/2026/numi_multiturn_seed.jsonl
    - datasets/2026/numi_product_seed.jsonl
    - datasets/2026/numi_news_2026_10.jsonl
    - datasets/2026/numi_sft_quality.jsonl
  max_seq_length: 1024
  packing: false

training:
  output_dir: outputs/lora_frontier
  num_epochs: 5
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 40
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  seed: 42
  report_to: none

inference:
  max_new_tokens: 256
  temperature: 0.6
  top_p: 0.9
