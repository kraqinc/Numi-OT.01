name: numi-lora-frontier
version: "0.2.1"

# Default: Gemma 2 9B Instruct — strong, Apache-friendly stack, works with 4-bit LoRA on Colab T4/L4.
# No Qwen. Override model_id for DeepSeek / Gemma-4 / MiMo when hardware allows.

base:
  model_id: "google/gemma-2-9b-it"
  trust_remote_code: false
  torch_dtype: bfloat16
  # true = BitsAndBytes 4-bit (not for models already shipped pre-quantized like gpt-oss mxfp4)
  load_in_4bit: true
  attn_implementation: sdpa

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

data:
  paths:
    - datasets/2026/numi_identity_seed.jsonl
    - datasets/2026/numi_conversation_seed.jsonl
    - datasets/2026/numi_code_seed.jsonl
    - datasets/2026/numi_multiturn_seed.jsonl
    - datasets/2026/numi_product_seed.jsonl
  max_seq_length: 1024
  packing: false

training:
  output_dir: outputs/lora_frontier
  num_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 50
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  seed: 42
  report_to: none

inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
