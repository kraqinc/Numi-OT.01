name: numi-lora-large
version: "0.4.0"

# Even stronger open path: DeepSeek-R1 reasoning distill on Llama-8B
# (NOT Qwen distill). May require Meta license accept on the Llama lineage.
# Prefer Hunyuan (lora_frontier) if you want zero Microsoft/Meta/Qwen brand.

base:
  model_id: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"
  trust_remote_code: false
  torch_dtype: bfloat16
  load_in_4bit: true
  attn_implementation: sdpa

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

data:
  paths:
    - datasets/2026/numi_identity_seed.jsonl
    - datasets/2026/numi_conversation_seed.jsonl
    - datasets/2026/numi_code_seed.jsonl
    - datasets/2026/numi_multiturn_seed.jsonl
    - datasets/2026/numi_product_seed.jsonl
    - datasets/2026/numi_news_2026_10.jsonl
    - datasets/2026/numi_sft_quality.jsonl
  max_seq_length: 1024
  packing: false

training:
  output_dir: outputs/lora_large
  num_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 8.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 25
  bf16: true
  gradient_checkpointing: true
  seed: 42
