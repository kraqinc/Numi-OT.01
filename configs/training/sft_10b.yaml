name: numi-sft-10b
version: "0.1.0"
description: "Numi-10B from-scratch SFT. Own weights only. No Qwen/external base."

model:
  vocab_size: 4125
  hidden_size: 4096
  intermediate_size: 11008
  moe_intermediate_size: 1408
  num_hidden_layers: 28
  num_attention_heads: 32
  num_key_value_heads: 8
  num_experts: 8
  num_experts_per_tok: 2
  max_position_embeddings: 8192
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true
  aux_loss_coef: 0.01
  initializer_range: 0.02

data:
  path: datasets/2026/numi_sft_10k.jsonl
  extra_paths:
    - datasets/2026/numi_conversation_seed.jsonl
    - datasets/2026/numi_identity_seed.jsonl
    - datasets/2026/numi_code_seed.jsonl
    - datasets/2026/numi_sft_quality.jsonl
    - datasets/2026/numi_sft_elite.jsonl
  tokenizer_path: artifacts/tokenizer
  max_seq_length: 512
  packing: true

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: outputs/sft_10b
  num_epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 50
  bf16: true
  gradient_checkpointing: true
  seed: 42
  device: cuda
