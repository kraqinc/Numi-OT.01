name: numi-sft-large
version: "0.1.0"
description: "From-scratch SFT for Numi-Large-OT (~10B total / ~20GB bf16). Original weights only."

# Load architecture from the large model config
model_config: configs/model/numi-large.yaml

# Explicit architecture (must match numi-large.yaml)
model:
  vocab_size: 128256
  hidden_size: 4096
  intermediate_size: 16384
  moe_intermediate_size: 2048
  num_hidden_layers: 32
  num_attention_heads: 32
  num_key_value_heads: 8
  num_experts: 16
  num_experts_per_tok: 2
  max_position_embeddings: 16384
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true
  aux_loss_coef: 0.01
  initializer_range: 0.02

data:
  # Seed data (expand later with massive code + knowledge corpus)
  paths:
    - datasets/2026/numi_identity_seed.jsonl
    - datasets/2026/numi_conversation_seed.jsonl
    - datasets/2026/numi_code_seed.jsonl
    - datasets/2026/numi_multiturn_seed.jsonl
    - datasets/2026/numi_product_seed.jsonl
    - datasets/2026/numi_sft_quality.jsonl
  max_seq_length: 4096          # start moderate; can raise to 8192/16384 later
  packing: true

lora:
  # Start with full SFT on random weights. Switch to LoRA only if VRAM is tight.
  enabled: false
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - w1
    - w2
    - w3

training:
  output_dir: outputs/sft_large
  num_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1.5e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 100
  bf16: true
  gradient_checkpointing: true
  seed: 42
  # Recommended for ~20GB model: ZeRO-2 / FSDP or DeepSpeed
  # Use on multi-GPU or high-VRAM single GPU (A100 40/80GB, H100, etc.)
