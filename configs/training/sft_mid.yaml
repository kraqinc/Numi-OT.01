name: numi-sft-mid
version: "0.1.1"
# Intermediate model: still trainable on Colab CPU (~15-40 min) or fast on GPU.
# Better than smoke; still not production LLM scale.

model:
  vocab_size: 2048
  hidden_size: 256
  intermediate_size: 512
  moe_intermediate_size: 128
  num_hidden_layers: 6
  num_attention_heads: 8
  num_key_value_heads: 2
  num_experts: 4
  num_experts_per_tok: 2
  max_position_embeddings: 512
  tie_word_embeddings: true
  aux_loss_coef: 0.01

data:
  path: datasets/2026/numi_conversation_seed.jsonl
  extra_paths:
    - datasets/2026/numi_identity_seed.jsonl
    - datasets/2026/numi_code_seed.jsonl
    - datasets/2026/numi_multiturn_seed.jsonl
  tokenizer_path: null
  max_seq_length: 256

lora:
  enabled: false

training:
  output_dir: outputs/sft_mid
  num_epochs: 8
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 100
  seed: 42
  device: auto
  gradient_checkpointing: false
