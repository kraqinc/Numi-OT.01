name: numi-sft-overfit
version: "0.1.0"
description: "Overfit pass on seed data to drive loss toward 1.x. Own weights only + BPE."

model:
  vocab_size: 4125
  hidden_size: 2048
  intermediate_size: 8192
  moe_intermediate_size: 1024
  num_hidden_layers: 24
  num_attention_heads: 16
  num_key_value_heads: 4
  num_experts: 8
  num_experts_per_tok: 2
  max_position_embeddings: 4096
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true
  aux_loss_coef: 0.01
  initializer_range: 0.02

data:
  path: datasets/2026/numi_conversation_seed.jsonl
  extra_paths:
    - datasets/2026/numi_identity_seed.jsonl
    - datasets/2026/numi_code_seed.jsonl
    - datasets/2026/numi_multiturn_seed.jsonl
    - datasets/2026/numi_product_seed.jsonl
    - datasets/2026/numi_sft_quality.jsonl
  tokenizer_path: artifacts/tokenizer
  max_seq_length: 1024
  packing: true

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: outputs/sft_overfit
  num_epochs: 30
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 50
  bf16: true
  gradient_checkpointing: true
  seed: 42
  device: cuda
  resume_from: outputs/sft_colab_t4/final.pt
