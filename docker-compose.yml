services:
  numi-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      NUMI_MODEL_ID: numi-ot-0.1
      NUMI_DEVICE: cpu
      NUMI_CONFIG: configs/training/sft.yaml
      NUMI_WARMUP: "1"
      NUMI_MAX_CONCURRENT: "2"
      NUMI_RATE_LIMIT_RPM: "60"
      # NUMI_API_KEY: set in real deploy
      # NUMI_CHECKPOINT: /app/outputs/sft/final.pt
    volumes:
      - ./outputs:/app/outputs
      - ./configs:/app/configs
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
