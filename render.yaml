services:
  - type: web
    name: numi-api
    runtime: docker
    plan: standard
    healthCheckPath: /live
    envVars:
      - key: NUMI_ENV
        value: production
      - key: NUMI_BACKEND
        value: peft
      - key: NUMI_MODEL_ID
        value: numi-ot-0.1
      - key: NUMI_DEVICE
        value: cpu
      - key: NUMI_PEFT_BASE
        value: HuggingFaceTB/SmolLM2-1.7B-Instruct
      - key: NUMI_PEFT_ADAPTER
        value: /app/adapters/final
      - key: NUMI_PEFT_4BIT
        value: "0"
      - key: NUMI_WARMUP
        value: "1"
      - key: NUMI_MAX_CONCURRENT
        value: "2"
      - key: NUMI_RATE_LIMIT_RPM
        value: "60"
      - key: NUMI_CORS_ORIGINS
        value: "*"
      - key: NUMI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
