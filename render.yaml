services:
  - type: web
    name: numi-api
    runtime: docker
    plan: starter
    healthCheckPath: /live
    envVars:
      - key: NUMI_ENV
        value: production
      - key: NUMI_BACKEND
        value: cloud
      - key: NUMI_MODEL_ID
        value: numi-ot-0.1
      - key: NUMI_WARMUP
        value: "1"
      - key: NUMI_MAX_CONCURRENT
        value: "8"
      - key: NUMI_RATE_LIMIT_RPM
        value: "120"
      - key: NUMI_CORS_ORIGINS
        value: "*"
      - key: NUMI_API_KEY
        sync: false
      - key: NUMI_CLOUD_API_KEY
        sync: false
      - key: NUMI_CLOUD_BASE_URL
        sync: false
      - key: NUMI_CLOUD_MODEL
        sync: false
